<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>實況主專屬遙控面板</title>
    <style>
        body {
            background: #0f172a;
            color: #cbd5e1;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .control-card {
            background: rgba(15, 23, 42, 0.95);
            border: 3px solid #38bdf8;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            width: 390px;
            text-align: left;
        }
        .control-header {
            font-size: 13px;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 2px dashed rgba(56, 189, 248, 0.4);
            padding-bottom: 6px;
        }
        .control-row {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
            align-items: center;
            font-size: 11px;
        }
        input, select {
            padding: 4px;
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #0284c7;
            border-radius: 8px;
            color: #38bdf8;
            font-weight: bold;
            font-family: inherit;
        }
        input[type="number"] { width: 40px; text-align: center; }
        .custom-name-input { width: 85px; }
        select { width: 100px; }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 5px 7px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(2, 132, 199, 0.4);
        }
        button:hover { background: #38bdf8; color: #0f172a; }
        .btn-flex { display: flex; gap: 4px; flex: 1; }
    </style>
</head>
<body>

    <div class="control-card">
        <div class="control-header">⚙️ 專屬遙控面板 (同步 OBS)</div>
        
        <div class="control-row" style="margin-bottom: 6px; background: rgba(30, 41, 59, 0.6); padding: 5px; border-radius: 8px;">
            <span>樣式:</span>
            <select id="styleSelect" onchange="changeStyle()">
                <option value="cyber">⚡ 炫酷賽博</option>
                <option value="cute">☁️ 可愛萌系</option>
                <option value="mc">🟫 MC 像素</option>
                <option value="clean">💎 好看簡約</option>
                <option value="aurora">🌌 漂亮極光</option>
                <option value="meme">🤡 搞笑迷因</option>
            </select>
            <button style="background: #0369a1; flex: 1;" onclick="copyObsLink()">📋 複製 OBS 網址</button>
        </div>

        <div style="font-size: 10px; color: #38bdf8; font-weight: bold; margin-bottom: 2px;">✏️ 自訂計時器文字</div>
        <div class="control-row" style="margin-bottom: 8px; background: rgba(30, 41, 59, 0.6); padding: 5px; border-radius: 8px;">
            <input type="text" id="customTitleInput" placeholder="輸入你想顯示的標題文字..." style="flex: 1; width: auto; font-size: 10px;">
            <button style="background: #059669;" onclick="setCustomTitle()">套用文字</button>
        </div>

        <div style="font-size: 10px; color: #38bdf8; font-weight: bold; margin-bottom: 2px;">📏 計時器尺寸縮放</div>
        <div class="control-row" style="margin-bottom: 8px; background: rgba(30, 41, 59, 0.6); padding: 5px; border-radius: 8px;">
            <span>大小:</span>
            <input type="range" id="scaleRange" min="0.5" max="2.0" step="0.1" value="1.0" style="flex: 1; cursor: pointer;" oninput="changeScale(this.value)">
            <span id="scaleValue" style="width: 35px; text-align: center; color: #38bdf8;">1.0倍</span>
            <button style="background: #475569;" onclick="resetScale()">重置</button>
        </div>

        <div style="font-size: 10px; color: #38bdf8; font-weight: bold; margin-bottom: 2px;">🖼️ 圖片背景與位置設定</div>
        <div class="control-row" style="margin-bottom: 4px; background: rgba(30, 41, 59, 0.6); padding: 5px; border-radius: 8px;">
            <input type="text" id="bgImgInput" placeholder="貼上圖片網址 (.jpg / .png)" style="flex: 1; width: auto; font-size: 10px;">
            <button style="background: #db2777;" onclick="setCustomBg()">套用</button>
            <button style="background: #475569;" onclick="clearCustomBg()">清除</button>
        </div>
        <div class="control-row" style="margin-bottom: 8px; background: rgba(30, 41, 59, 0.6); padding: 5px; border-radius: 8px;">
            <span>位置:</span>
            <select id="bgPosSelect" onchange="updateBgPosition()" style="flex: 1; width: auto;">
                <option value="center">置中 (Center)</option>
                <option value="top">靠上 (Top)</option>
                <option value="bottom">靠下 (Bottom)</option>
                <option value="left">靠左 (Left)</option>
                <option value="right">靠右 (Right)</option>
                <option value="top left">左上 (Top Left)</option>
                <option value="top right">右上 (Top Right)</option>
                <option value="bottom left">左下 (Bottom Left)</option>
                <option value="bottom right">右下 (Bottom Right)</option>
            </select>
        </div>

        <div class="control-row" style="margin-bottom: 8px; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 6px;">
            <span>時間:</span>
            <input type="number" id="initH" value="2" min="0">時
            <input type="number" id="initM" value="0" min="0" max="59">分
            <input type="number" id="initS" value="0" min="0" max="59">秒
            <button onclick="setInitialTime()">重設</button>
            <button onclick="forceStart()" id="toggleBtn" style="background:#dc2626;">暫停</button>
        </div>

        <div style="font-size: 10px; color: #38bdf8; font-weight: bold; margin-bottom: 2px;">💎 斗內自動暫停設定</div>
        <div class="control-row" style="margin-bottom: 8px; background: rgba(30, 41, 59, 0.6); padding: 5px; border-radius: 8px;">
            <span>滿</span>
            <input type="number" id="pauseMinAmt" value="100" min="1">元
            <span>暫停</span>
            <input type="number" id="pauseMin" value="0" min="0">分
            <input type="number" id="pauseSec" value="10" min="0" max="59">秒
            <button style="background: #7c3aed;" onclick="saveAllConfig()">儲存設定</button>
        </div>

        <div style="font-size: 10px; color: #38bdf8; font-weight: bold; margin-bottom: 4px;">📋 各事件加時與名稱自訂</div>

        <div class="control-row">
            <input type="text" class="custom-name-input" id="e1Name" value="⚡ 訂閱">
            <input type="number" id="e1Sec" value="600" min="1">秒
            <button class="btn-flex" style="background:#0284c7;" onclick="triggerEvent('e1Name', 'e1Sec', '小美')">測試</button>
        </div>

        <div class="control-row">
            <input type="text" class="custom-name-input" id="e2Name" value="🎁 抽獎">
            <input type="number" id="e2Sec" value="300" min="1">秒
            <button class="btn-flex" style="background:#d97706; color:#fff;" onclick="triggerEvent('e2Name', 'e2Sec', '阿華')">測試</button>
        </div>

        <div class="control-row">
            <input type="text" class="custom-name-input" id="e3Name" value="⚓ 艦長">
            <input type="number" id="e3Sec" value="1200" min="1">秒
            <button class="btn-flex" style="background:#7c3aed;" onclick="triggerEvent('e3Name', 'e3Sec', '大戶')">測試</button>
        </div>

        <div class="control-row">
            <input type="text" class="custom-name-input" id="e4Name" value="💎 抖內換算">
            <input type="number" id="e4Sec" value="2.9" min="0.1" step="0.1" style="width:34px;">秒/元
            <input type="number" id="testDonationAmt" value="100" min="1" style="width:38px;">元
            <button style="background:#db2777;" onclick="testCustomDonation()">測試斗內</button>
        </div>
        
        <button style="background: #059669; width: 100%; margin-top: 5px;" onclick="saveAllConfig()">💾 儲存所有自訂內容</button>
    </div>

    <script>
        let isRunning = localStorage.getItem('timerIsRunning') !== 'false';
        const toggleBtn = document.getElementById('toggleBtn');
        if (toggleBtn) {
            toggleBtn.textContent = isRunning ? "暫停" : "開始";
            toggleBtn.style.background = isRunning ? "#dc2626" : "#059669";
        }

        function loadConfig() {
            if(localStorage.getItem('e1Name')) document.getElementById('e1Name').value = localStorage.getItem('e1Name');
            if(localStorage.getItem('e1Sec')) document.getElementById('e1Sec').value = localStorage.getItem('e1Sec');
            if(localStorage.getItem('e2Name')) document.getElementById('e2Name').value = localStorage.getItem('e2Name');
            if(localStorage.getItem('e2Sec')) document.getElementById('e2Sec').value = localStorage.getItem('e2Sec');
            if(localStorage.getItem('e3Name')) document.getElementById('e3Name').value = localStorage.getItem('e3Name');
            if(localStorage.getItem('e3Sec')) document.getElementById('e3Sec').value = localStorage.getItem('e3Sec');
            if(localStorage.getItem('e4Name')) document.getElementById('e4Name').value = localStorage.getItem('e4Name');
            if(localStorage.getItem('e4Sec')) document.getElementById('e4Sec').value = localStorage.getItem('e4Sec');
            
            if(localStorage.getItem('pauseMinAmt')) document.getElementById('pauseMinAmt').value = localStorage.getItem('pauseMinAmt');
            if(localStorage.getItem('pauseMin')) document.getElementById('pauseMin').value = localStorage.getItem('pauseMin');
            if(localStorage.getItem('pauseSec')) document.getElementById('pauseSec').value = localStorage.getItem('pauseSec');
            if(localStorage.getItem('timerScale')) {
                let s = localStorage.getItem('timerScale');
                document.getElementById('scaleRange').value = s;
                document.getElementById('scaleValue').textContent = s + '倍';
            }
            if(localStorage.getItem('timerCustomTitle')) document.getElementById('customTitleInput').value = localStorage.getItem('timerCustomTitle');
            if(localStorage.getItem('timerCustomBg')) document.getElementById('bgImgInput').value = localStorage.getItem('timerCustomBg');
            if(localStorage.getItem('timerCustomBgPos')) document.getElementById('bgPosSelect').value = localStorage.getItem('timerCustomBgPos');
            if(localStorage.getItem('timerStyle')) document.getElementById('styleSelect').value = localStorage.getItem('timerStyle');
        }
        loadConfig();

        function saveAllConfig() {
            localStorage.setItem('e1Name', document.getElementById('e1Name').value);
            localStorage.setItem('e1Sec', document.getElementById('e1Sec').value);
            localStorage.setItem('e2Name', document.getElementById('e2Name').value);
            localStorage.setItem('e2Sec', document.getElementById('e2Sec').value);
            localStorage.setItem('e3Name', document.getElementById('e3Name').value);
            localStorage.setItem('e3Sec', document.getElementById('e3Sec').value);
            localStorage.setItem('e4Name', document.getElementById('e4Name').value);
            localStorage.setItem('e4Sec', document.getElementById('e4Sec').value);

            localStorage.setItem('pauseMinAmt', document.getElementById('pauseMinAmt').value);
            localStorage.setItem('pauseMin', document.getElementById('pauseMin').value);
            localStorage.setItem('pauseSec', document.getElementById('pauseSec').value);
            alert("所有設定已儲存！");
        }

        function changeStyle() {
            localStorage.setItem('timerStyle', document.getElementById('styleSelect').value);
        }

        function setCustomTitle() {
            localStorage.setItem('timerCustomTitle', document.getElementById('customTitleInput').value.trim());
            alert("標題已套用！");
        }

        function changeScale(val) {
            document.getElementById('scaleValue').textContent = val + '倍';
            localStorage.setItem('timerScale', val);
        }

        function resetScale() {
            document.getElementById('scaleRange').value = "1.0";
            changeScale("1.0");
        }

        function setCustomBg() {
            let url = document.getElementById('bgImgInput').value.trim();
            if (url) {
                localStorage.setItem('timerCustomBg', url);
                alert("背景圖片已套用！");
            }
        }

        function updateBgPosition() {
            localStorage.setItem('timerCustomBgPos', document.getElementById('bgPosSelect').value);
        }

        function clearCustomBg() {
            localStorage.removeItem('timerCustomBg');
            localStorage.removeItem('timerCustomBgPos');
            document.getElementById('bgImgInput').value = '';
            alert("背景圖片已清除！");
        }

        function setInitialTime() {
            let h = parseInt(document.getElementById('initH').value) || 0;
            let m = parseInt(document.getElementById('initM').value) || 0;
            let s = parseInt(document.getElementById('initS').value) || 0;
            let total = (h * 3600) + (m * 60) + s;
            localStorage.setItem('streamTimerLeft', total);
            alert(`時間已重設為 ${h}時${m}分${s}秒`);
        }

        function forceStart() {
            isRunning = !isRunning;
            localStorage.setItem('timerIsRunning', isRunning);
            toggleBtn.textContent = isRunning ? "暫停" : "開始";
            toggleBtn.style.background = isRunning ? "#dc2626" : "#059669";
        }

        function triggerEvent(nameId, secId, username) {
            let eventName = document.getElementById(nameId).value || '事件';
            let val = parseFloat(document.getElementById(secId).value) || 60;
            
            let cur = parseInt(localStorage.getItem('streamTimerLeft')) || 7200;
            let newTime = cur + val;
            localStorage.setItem('streamTimerLeft', newTime);

            localStorage.setItem('timerPopupEvent', JSON.stringify({
                text: `⚡ 感謝 【${username}】 達成【${eventName}】！`,
                plus: `+${val}s`,
                time: Date.now()
            }));
            alert(`成功加時 ${val} 秒！`);
        }

        function testCustomDonation() {
            let amount = parseFloat(document.getElementById('testDonationAmt').value) || 100;
            let rate = parseFloat(document.getElementById('e4Sec').value) || 2.9;
            let addedSeconds = Math.round(amount * rate);
            
            let cur = parseInt(localStorage.getItem('streamTimerLeft')) || 7200;
            let newTime = cur + addedSeconds;
            localStorage.setItem('streamTimerLeft', newTime);

            let reqAmount = parseFloat(document.getElementById('pauseMinAmt').value) || 100;
            let pMin = parseInt(document.getElementById('pauseMin').value) || 0;
            let pSec = parseInt(document.getElementById('pauseSec').value) || 10;
            let pauseTotalSec = (pMin * 60) + pSec;

            let popText = `💎 感謝 【測試觀眾】 贊助 $${amount}！`;
            if (amount >= reqAmount && pauseTotalSec > 0) {
                localStorage.setItem('timerIsRunning', 'false');
                popText = `☕ 感謝 測試觀眾 贊助 $${amount}！暫停 ${pMin}分${pSec}秒！`;
                setTimeout(() => {
                    localStorage.setItem('timerIsRunning', 'true');
                    localStorage.setItem('timerPopupEvent', JSON.stringify({
                        text: "▶️ 暫停結束，自動繼續加班！",
                        plus: "",
                        time: Date.now()
                    }));
                }, pauseTotalSec * 1000);
            }

            localStorage.setItem('timerPopupEvent', JSON.stringify({
                text: popText,
                plus: `+${addedSeconds}s`,
                time: Date.now()
            }));
            alert(`模擬斗內 $${amount} 成功，已加 ${addedSeconds} 秒！`);
        }

        function copyObsLink() {
            let currentUrl = window.location.href;
            let obsUrl = currentUrl.replace('controller.html', 'index.html');
            navigator.clipboard.writeText(obsUrl).then(() => {
                alert('已複製 OBS 顯示端網址：\n' + obsUrl);
            });
        }
    </script>
</body>
</html>
