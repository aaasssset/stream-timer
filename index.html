<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>全自訂實況加班台計時器 (終極完整版)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&family=Press+Start+2P&display=swap');

        body {
            background-color: transparent;
            margin: 0;
            padding: 20px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: auto;
        }

        .main-wrapper {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            padding: 40px;
        }

        /* 左側：計時器主框（點擊可直接手動加時） */
        .timer-card {
            position: relative;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.9));
            border: 3px solid #00ffff;
            border-radius: 25px;
            padding: 30px 40px;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(0, 255, 255, 0.2);
            text-align: center;
            width: 380px;
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease, border-color 0.2s ease;
            transform-origin: center;
            background-size: cover !important;
            background-repeat: no-repeat !important;
            cursor: pointer;
            z-index: 2;
        }

        .timer-card:hover {
            border-color: #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
        }

        .timer-title {
            font-size: 15px;
            color: #38bdf8;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        .timer-container {
            position: relative;
            display: inline-block;
        }

        #timer {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 52px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff;
        }

        /* 加秒數浮動特效 */
        .floating-plus {
            position: absolute;
            right: -85px;
            top: 5px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 26px;
            font-weight: bold;
            color: #ff007f;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
            opacity: 0;
            transform: translateY(15px) scale(0.8);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            white-space: nowrap;
            z-index: 100;
        }

        .floating-plus.show {
            opacity: 1;
            transform: translateY(-8px) scale(1.2);
        }

        /* 感謝彈跳訊息 */
        .pop-msg {
            position: absolute;
            bottom: -60px;
            top: auto;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.6);
            border: 1px solid #38bdf8;
            white-space: nowrap;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 100;
        }

        .pop-msg.show {
            transform: translateX(-50%) scale(1);
        }

        /* 右側：控制面板（在 OBS 內會自動隱藏！用電腦瀏覽器開時會出現讓你自訂） */
        .control-card {
            background: rgba(15, 23, 42, 0.9);
            border: 3px solid #38bdf8;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            width: 390px;
            text-align: left;
            backdrop-filter: blur(10px);
            max-height: 90vh;
            overflow-y: auto;
            z-index: 1;
        }

        .control-header {
            font-size: 13px;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 2px dashed rgba(56, 189, 248, 0.4);
            padding-bottom: 6px;
            letter-spacing: 1px;
        }

        .control-row {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
            align-items: center;
            font-size: 11px;
            color: #cbd5e1;
        }

        input, select {
            padding: 4px;
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #0284c7;
            border-radius: 8px;
            color: #38bdf8;
            font-weight: bold;
            font-family: inherit;
        }

        input[type="number"] { width: 40px; text-align: center; }
        .custom-name-input { width: 85px; }
        select { width: 100px; }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 5px 7px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 8px rgba(2, 132, 199, 0.4);
        }

        button:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-1px);
        }

        .btn-flex {
            display: flex;
            gap: 4px;
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- 左側：計時器主框 -->
        <div class="timer-card" id="timerCard" title="點擊可手動加時">
            <div id="popMsg" class="pop-msg">⚡ 點擊計時器可手動加時</div>
            <div id="timerTitle" class="timer-title">⚡ 加班台 ⚡</div>
            
            <div class="timer-container">
                <div id="timer">02:00:00</div>
                <div id="floatingPlus" class="floating-plus">+10s</div>
            </div>
        </div>

        <!-- 右側：控制面板（OBS 內自動隱藏） -->
        <div class="control-card" id="controlPanel">
            <div class="control-header">⚙️ 樣式與自訂控制面板</div>
            
            <div class="control-row" style="margin-bottom: 6px; background: rgba(30, 41, 59, 0.6); padding: 5px; border-radius: 8px;">
                <span>樣式:</span>
                <select id="styleSelect" onchange="changeStyle()">
                    <option value="cyber">⚡ 炫酷賽博</option>
                    <option value="cute">☁️ 可愛萌系</option>
                    <option value="mc">🟫 MC 像素</option>
                    <option value="clean">💎 好看簡約</option>
                    <option value="aurora">🌌 漂亮極光</option>
                    <option value="meme">🤡 搞笑迷因</option>
                </select>
                <button style="background: #0369a1; flex: 1;" onclick="copyTimerLink()">📋 複製網址</button>
            </div>

            <div style="font-size: 10px; color: #38bdf8; font-weight: bold; margin-bottom: 2px;">✏️ 自訂計時器文字</div>
            <div class="control-row" style="margin-bottom: 8px; background: rgba(30, 41, 59, 0.6); padding: 5px; border-radius: 8px;">
                <input type="text" id="customTitleInput" placeholder="輸入標題..." style="flex: 1; width: auto; font-size: 10px;">
                <button style="background: #059669;" onclick="setCustomTitle()">套用</button>
            </div>

            <div style="font-size: 10px; color: #38bdf8; font-weight: bold; margin-bottom: 2px;">📏 尺寸縮放</div>
            <div class="control-row" style="margin-bottom: 8px; background: rgba(30, 41, 59, 0.6); padding: 5px; border-radius: 8px;">
                <span>大小:</span>
                <input type="range" id="scaleRange" min="0.5" max="2.0" step="0.1" value="1.0" style="flex: 1; cursor: pointer;" oninput="changeScale(this.value)">
                <span id="scaleValue" style="width: 35px; text-align: center; color: #38bdf8;">1.0倍</span>
                <button style="background: #475569;" onclick="resetScale()">重置</button>
            </div>

            <div style="font-size: 10px; color: #38bdf8; font-weight: bold; margin-bottom: 2px;">🖼️ 圖片背景設定</div>
            <div class="control-row" style="margin-bottom: 4px; background: rgba(30, 41, 59, 0.6); padding: 5px; border-radius: 8px;">
                <input type="text" id="bgImgInput" placeholder="圖片網址 (.jpg/.png)" style="flex: 1; width: auto; font-size: 10px;">
                <button style="background: #db2777;" onclick="setCustomBg()">套用</button>
                <button style="background: #475569;" onclick="clearCustomBg()">清除</button>
            </div>
            <div class="control-row" style="margin-bottom: 8px; background: rgba(30, 41, 59, 0.6); padding: 5px; border-radius: 8px;">
                <span>位置:</span>
                <select id="bgPosSelect" onchange="updateBgPosition()" style="flex: 1; width: auto;">
                    <option value="center">置中</option>
                    <option value="top">靠上</option>
                    <option value="bottom">靠下</option>
                    <option value="left">靠左</option>
                    <option value="right">靠右</option>
                </select>
            </div>

            <div class="control-row" style="margin-bottom: 8px; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 6px;">
                <span>時間:</span>
                <input type="number" id="initH" value="2" min="0">時
                <input type="number" id="initM" value="0" min="0" max="59">分
                <input type="number" id="initS" value="0" min="0" max="59">秒
                <button onclick="setInitialTime()">重設</button>
                <button onclick="forceStart()" id="toggleBtn" style="background:#dc2626;">暫停</button>
            </div>

            <div style="font-size: 10px; color: #38bdf8; font-weight: bold; margin-bottom: 2px;">💎 斗內自動暫停設定</div>
            <div class="control-row" style="margin-bottom: 8px; background: rgba(30, 41, 59, 0.6); padding: 5px; border-radius: 8px;">
                <span>滿</span>
                <input type="number" id="pauseMinAmt" value="100" min="1">元
                <span>暫停</span>
                <input type="number" id="pauseMin" value="0" min="0">分
                <input type="number" id="pauseSec" value="10" min="0" max="59">秒
                <button style="background: #7c3aed;" onclick="saveAllConfig()">儲存</button>
            </div>

            <div style="font-size: 10px; color: #38bdf8; font-weight: bold; margin-bottom: 4px;">📋 事件測試</div>
            <div class="control-row">
                <input type="text" class="custom-name-input" id="e1Name" value="⚡ 訂閱">
                <input type="number" id="e1Sec" value="600" min="1">秒
                <button class="btn-flex" style="background:#0284c7;" onclick="triggerEvent('e1Name', 'e1Sec', '小美')">測試訂閱</button>
            </div>
            <div class="control-row">
                <input type="text" class="custom-name-input" id="e4Name" value="💎 抖內換算">
                <input type="number" id="e4Sec" value="2.9" min="0.1" step="0.1" style="width:34px;">秒/元
                <input type="number" id="testDonationAmt" value="100" min="1" style="width:38px;">元
                <button style="background:#db2777;" onclick="testCustomDonation()">測試斗內</button>
            </div>
            
            <button style="background: #059669; width: 100%; margin-top: 5px;" onclick="saveAllConfig()">💾 儲存所有設定</button>
        </div>
    </div>

    <script>
        // 自動偵測：如果在 OBS 裡面，自動隱藏右側控制面板（觀眾絕對看不到）
        const isObs = Boolean(window.obsstudio);
        if (isObs) {
            document.getElementById('controlPanel').style.display = 'none';
        }

        let savedTime = localStorage.getItem('streamTimerLeft');
        let timeLeft = (savedTime !== null && !isNaN(parseInt(savedTime))) ? parseInt(savedTime) : 7200;
        let isRunning = localStorage.getItem('timerIsRunning') !== 'false';

        const timerCard = document.getElementById('timerCard');
        const timerTitle = document.getElementById('timerTitle');
        const timerDisplay = document.getElementById('timer');
        const popMsg = document.getElementById('popMsg');
        const toggleBtn = document.getElementById('toggleBtn');
        const floatingPlus = document.getElementById('floatingPlus');
        const styleSelect = document.getElementById('styleSelect');
        const bgImgInput = document.getElementById('bgImgInput');
        const bgPosSelect = document.getElementById('bgPosSelect');
        const scaleRange = document.getElementById('scaleRange');
        const scaleValue = document.getElementById('scaleValue');
        const customTitleInput = document.getElementById('customTitleInput');

        if (toggleBtn) {
            toggleBtn.textContent = isRunning ? "暫停" : "開始";
            toggleBtn.style.background = isRunning ? "#dc2626" : "#059669";
        }

        function applyAllVisuals() {
            let style = localStorage.getItem('timerStyle') || 'cyber';
            let customTitle = localStorage.getItem('timerCustomTitle') || '';
            let scale = localStorage.getItem('timerScale') || '1.0';
            let bgImg = localStorage.getItem('timerCustomBg') || '';
            let bgPos = localStorage.getItem('timerCustomBgPos') || 'center';

            timerCard.style.transform = `scale(${scale})`;

            if (customTitle) {
                timerTitle.textContent = customTitle;
                if(!isObs && customTitleInput) customTitleInput.value = customTitle;
            } else {
                applyStyleVisual(style);
            }

            if (bgImg) {
                timerCard.style.background = `url('${bgImg}') ${bgPos} / cover`;
                if(!isObs && bgImgInput) bgImgInput.value = bgImg;
            } else {
                timerCard.style.background = '';
                applyStyleVisual(style);
            }
        }

        function applyStyleVisual(style) {
            if (localStorage.getItem('timerCustomTitle') || localStorage.getItem('timerCustomBg')) return;

            if (style === 'cyber') {
                timerCard.style.border = "3px solid #00ffff";
                timerCard.style.borderRadius = "25px";
                timerCard.style.boxShadow = "0 0 25px rgba(0, 255, 255, 0.4)";
                timerTitle.textContent = "⚡ 加班台 ⚡";
                timerTitle.style.color = "#38bdf8";
                timerDisplay.style.color = "#ffffff";
                timerDisplay.style.textShadow = "0 0 15px #00ffff";
            } else if (style === 'cute') {
                timerCard.style.border = "4px dashed #ffb6c1";
                timerCard.style.borderRadius = "30px";
                timerCard.style.boxShadow = "0 10px 25px rgba(255, 182, 193, 0.4)";
                timerTitle.textContent = "🌸 努力加班中・求投餵 🌸";
                timerTitle.style.color = "#ff69b4";
                timerDisplay.style.color = "#ff1493";
                timerDisplay.style.textShadow = "2px 2px 0px #ffe4e1";
            } else if (style === 'mc') {
                timerCard.style.border = "4px solid #3b2716";
                timerCard.style.borderRadius = "0px";
                timerCard.style.boxShadow = "inset 4px 4px 0px #888, inset -4px -4px 0px #222";
                timerTitle.textContent = "🟫 MINECRAFT 生存加班 🟫";
                timerTitle.style.color = "#ffff55";
                timerDisplay.style.color = "#ffff55";
                timerDisplay.style.textShadow = "3px 3px 0px #3f3f3f";
            } else if (style === 'clean') {
                timerCard.style.border = "2px solid #e2e8f0";
                timerCard.style.borderRadius = "16px";
                timerCard.style.boxShadow = "0 10px 30px rgba(0, 0, 0, 0.1)";
                timerTitle.textContent = "💎 專注直播中";
                timerTitle.style.color = "#64748b";
                timerDisplay.style.color = "#0f172a";
                timerDisplay.style.textShadow = "none";
            } else if (style === 'aurora') {
                timerCard.style.border = "3px solid #c084fc";
                timerCard.style.borderRadius = "25px";
                timerCard.style.boxShadow = "0 0 30px rgba(192, 132, 252, 0.5)";
                timerTitle.textContent = "🌌 極光星海・無限加班 🌌";
                timerTitle.style.color = "#e9d5ff";
                timerDisplay.style.color = "#ffffff";
                timerDisplay.style.textShadow = "0 0 20px #c084fc";
            } else if (style === 'meme') {
                timerCard.style.border = "4px solid #facc15";
                timerCard.style.borderRadius = "10px";
                timerCard.style.boxShadow = "0 0 35px rgba(250, 204, 21, 0.6)";
                timerTitle.textContent = "🤡 幫我按暫停也沒用・給我加班 🤡";
                timerTitle.style.color = "#facc15";
                timerDisplay.style.color = "#ffffff";
                timerDisplay.style.textShadow = "3px 3px 0px #000";
            }
        }

        function updateDisplay() {
            let hours = Math.floor(timeLeft / 3600);
            let minutes = Math.floor((timeLeft % 3600) / 60);
            let seconds = Math.floor(timeLeft % 60);

            timerDisplay.textContent = 
                String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0');

            localStorage.setItem('streamTimerLeft', timeLeft);
        }

        function forceStart() {
            isRunning = !isRunning;
            localStorage.setItem('timerIsRunning', isRunning);
            if (toggleBtn) {
                toggleBtn.textContent = isRunning ? "暫停" : "開始";
                toggleBtn.style.background = isRunning ? "#dc2626" : "#059669";
            }
            let msg = isRunning ? "▶️ 倒數計時中！" : "⏸️ 計時器已暫停";
            showPopup(msg, "");
            localStorage.setItem('timerPopupEvent', JSON.stringify({ text: msg, plus: "", time: Date.now() }));
        }

        function setInitialTime() {
            let h = parseInt(document.getElementById('initH').value) || 0;
            let m = parseInt(document.getElementById('initM').value) || 0;
            let s = parseInt(document.getElementById('initS').value) || 0;
            timeLeft = (h * 3600) + (m * 60) + s;
            updateDisplay();
            let msg = `⏱️ 時間重設為 ${h}時${m}分${s}秒`;
            showPopup(msg, "");
            localStorage.setItem('timerPopupEvent', JSON.stringify({ text: msg, plus: "", time: Date.now() }));
        }

        function triggerEvent(nameId, secId, username) {
            let eventName = document.getElementById(nameId).value || '事件';
            let val = parseFloat(document.getElementById(secId).value) || 60;
            
            timeLeft += val;
            updateDisplay();
            let popText = `⚡ 感謝 【${username}】 達成【${eventName}】！`;
            let plusText = `+${val}s`;
            showPopup(popText, plusText);
            localStorage.setItem('timerPopupEvent', JSON.stringify({ text: popText, plus: plusText, time: Date.now() }));
        }

        function testCustomDonation() {
            let amount = parseFloat(document.getElementById('testDonationAmt').value) || 100;
            handleDonation('測試觀眾', amount);
        }

        function handleDonation(username, amount) {
            let rate = parseFloat(document.getElementById('e4Sec').value) || 2.9;
            let addedSeconds = Math.round(amount * rate);
            
            timeLeft += addedSeconds;
            updateDisplay();

            let reqAmount = parseFloat(document.getElementById('pauseMinAmt').value) || 100;
            let pMin = parseInt(document.getElementById('pauseMin').value) || 0;
            let pSec = parseInt(document.getElementById('pauseSec').value) || 10;
            let pauseTotalSec = (pMin * 60) + pSec;

            let popText = `💎 感謝 【${username}】 贊助 $${amount}！`;
            let plusText = `+${addedSeconds}s`;

            if (amount >= reqAmount && pauseTotalSec > 0) {
                isRunning = false;
                localStorage.setItem('timerIsRunning', 'false');
                if (toggleBtn) {
                    toggleBtn.textContent = "開始";
                    toggleBtn.style.background = "#059669";
                }
                popText = `☕ 感謝 ${username} 贊助 $${amount}！暫停 ${pMin}分${pSec}秒！`;
                showPopup(popText, plusText);
                localStorage.setItem('timerPopupEvent', JSON.stringify({ text: popText, plus: plusText, time: Date.now() }));

                setTimeout(() => {
                    isRunning = true;
                    localStorage.setItem('timerIsRunning', 'true');
                    if (toggleBtn) {
                        toggleBtn.textContent = "暫停";
                        toggleBtn.style.background = "#dc2626";
                    }
                    let resumeText = "▶️ 暫停結束，自動繼續加班！";
                    showPopup(resumeText, "");
                    localStorage.setItem('timerPopupEvent', JSON.stringify({ text: resumeText, plus: "", time: Date.now() }));
                }, pauseTotalSec * 1000);
            } else {
                showPopup(popText, plusText);
                localStorage.setItem('timerPopupEvent', JSON.stringify({ text: popText, plus: plusText, time: Date.now() }));
            }
        }

        // 點擊計時器卡片：以「幾時、幾分、幾秒」手動加時
        timerCard.addEventListener('click', () => {
            let hInput = prompt("【手動加時】\n請輸入要增加的小時數 (沒有請填 0)：", "0");
            if (hInput === null) return;
            let mInput = prompt("【手動加時】\n請輸入要增加的分鐘數 (沒有請填 0)：", "0");
            if (mInput === null) return;
            let sInput = prompt("【手動加時】\n請輸入要增加的秒數 (沒有請填 0)：", "0");
            if (sInput === null) return;

            let h = parseInt(hInput) || 0;
            let m = parseInt(mInput) || 0;
            let s = parseInt(sInput) || 0;

            let totalAddSec = (h * 3600) + (m * 60) + s;

            if (totalAddSec !== 0) {
                timeLeft += totalAddSec;
                updateDisplay();
                let msg = `+${h > 0 ? h + 'h ' : ''}${m > 0 ? m + 'm ' : ''}${s > 0 ? s + 's' : ''}`.trim();
                showPopup("✨ 手動調整時間", msg);
                localStorage.setItem('timerPopupEvent', JSON.stringify({ text: "✨ 手動調整時間", plus: msg, time: Date.now() }));
            } else {
                alert("沒有增加任何時間！");
            }
        });

        function setCustomTitle() {
            let titleText = customTitleInput.value.trim();
            if (titleText) {
                localStorage.setItem('timerCustomTitle', titleText);
                timerTitle.textContent = titleText;
                showPopup("✏️ 標題已套用！", "成功");
                localStorage.setItem('timerPopupEvent', JSON.stringify({ text: "✏️ 標題已套用！", plus: "", time: Date.now() }));
            } else {
                localStorage.removeItem('timerCustomTitle');
                applyAllVisuals();
                showPopup("🗑️ 已恢復預設標題", "清除");
            }
        }

        function changeScale(val) {
            timerCard.style.transform = `scale(${val})`;
            scaleValue.textContent = val + '倍';
            localStorage.setItem('timerScale', val);
        }

        function resetScale() {
            scaleRange.value = "1.0";
            changeScale("1.0");
            showPopup("📏 尺寸已重置為 1.0倍", "重置");
        }

        function setCustomBg() {
            let url = bgImgInput.value.trim();
            if (url) {
                localStorage.setItem('timerCustomBg', url);
                let pos = bgPosSelect.value;
                timerCard.style.background = `url('${url}') ${pos} / cover`;
                showPopup("🖼️ 背景圖片已套用！", "成功");
                localStorage.setItem('timerPopupEvent', JSON.stringify({ text: "🖼️ 背景圖片已套用！", plus: "", time: Date.now() }));
            }
        }

        function updateBgPosition() {
            let pos = bgPosSelect.value;
            localStorage.setItem('timerCustomBgPos', pos);
            let url = localStorage.getItem('timerCustomBg');
            if (url) {
                timerCard.style.background = `url('${url}') ${pos} / cover`;
                showPopup(`📍 圖片位置改為：${pos}`, "調整");
            }
        }

        function clearCustomBg() {
            localStorage.removeItem('timerCustomBg');
            localStorage.removeItem('timerCustomBgPos');
            if(!isObs) {
                bgImgInput.value = '';
                bgPosSelect.value = 'center';
            }
            applyAllVisuals();
            showPopup("🗑️ 已清除自訂圖片", "已清除");
        }

        function changeStyle() {
            let style = styleSelect.value;
            localStorage.setItem('timerStyle', style);
            applyAllVisuals();
        }

        function copyTimerLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showPopup("🔗 網址已複製！", "已複製");
            });
        }

        function loadConfig() {
            if(localStorage.getItem('e1Name')) document.getElementById('e1Name').value = localStorage.getItem('e1Name');
            if(localStorage.getItem('e1Sec')) document.getElementById('e1Sec').value = localStorage.getItem('e1Sec');
            if(localStorage.getItem('e4Name')) document.getElementById('e4Name').value = localStorage.getItem('e4Name');
            if(localStorage.getItem('e4Sec')) document.getElementById('e4Sec').value = localStorage.getItem('e4Sec');
            if(localStorage.getItem('pauseMinAmt')) document.getElementById('pauseMinAmt').value = localStorage.getItem('pauseMinAmt');
            if(localStorage.getItem('pauseMin')) document.getElementById('pauseMin').value = localStorage.getItem('pauseMin');
            if(localStorage.getItem('pauseSec')) document.getElementById('pauseSec').value = localStorage.getItem('pauseSec');
            if(localStorage.getItem('timerScale')) {
                let s = localStorage.getItem('timerScale');
                scaleRange.value = s;
                scaleValue.textContent = s + '倍';
            }
            if(localStorage.getItem('timerCustomBgPos')) {
                bgPosSelect.value = localStorage.getItem('timerCustomBgPos');
            }
        }
        if(!isObs) loadConfig();

        function saveAllConfig() {
            showPopup("💾 所有設定已儲存！", "已儲存");
            localStorage.setItem('timerPopupEvent', JSON.stringify({ text: "💾 所有設定已儲存！", plus: "", time: Date.now() }));
        }

        let hideTimeout = null;
        function showPopup(text, plusText) {
            popMsg.textContent = text;
            popMsg.classList.add('show');
            if (plusText) {
                floatingPlus.textContent = plusText;
                floatingPlus.classList.add('show');
            }
            if (hideTimeout) clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                popMsg.classList.remove('show');
                floatingPlus.classList.remove('show');
            }, 4000); 
        }

        // 自動倒數核心
        setInterval(() => {
            isRunning = localStorage.getItem('timerIsRunning') !== 'false';
            if (isRunning && timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            }
        }, 1000);

        // 串流事件自動感應 (Streamlabs / StreamElements)
        window.addEventListener('onEventReceived', function (obj) {
            let event = obj.detail;
            if (!event) return;

            if (event.listener === 'subscriber') {
                let username = event.event.name;
                let seconds = parseFloat(document.getElementById('e1Sec')?.value) || 600;
                timeLeft += seconds;
                updateDisplay();
                showPopup(`💙 謝謝 【${username}】 訂閱！`, `+${seconds}s`);
            }

            if (event.listener === 'donation' || event.listener === 'superchat') {
                let username = event.event.name;
                let amount = event.event.amount;
                handleDonation(username, amount);
            }
        });

        // 跨分頁 / OBS 與控制面板即時同步
        window.addEventListener('storage', (e) => {
            if (e.key === 'streamTimerLeft') {
                let val = parseInt(e.newValue);
                if (!isNaN(val) && val !== timeLeft) {
                    timeLeft = val;
                    updateDisplay();
                }
            }
            if (e.key === 'timerStyle' || e.key === 'timerCustomTitle' || e.key === 'timerScale' || e.key === 'timerCustomBg' || e.key === 'timerCustomBgPos') {
                applyAllVisuals();
            }
            if (e.key === 'timerPopupEvent') {
                let data = JSON.parse(e.newValue);
                showPopup(data.text, data.plus);
            }
        });

        applyAllVisuals();
        updateDisplay();
    </script>
</body>
</html>
